<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="420" style="background:#0f172a; border-radius:12px; font-family:system-ui, sans-serif;">
  <text x="425" y="30" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">OBJECT-ORIENTED CLASS HIERARCHY &amp; COMPOSITION</text>

  <rect x="275" y="50" width="300" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="275" y="50" width="300" height="28" rx="8" fill="#1e40af"/>
  <text x="425" y="69" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">&lt;&lt;Abstract&gt;&gt; BaseController</text>
  <text x="290" y="98" fill="#93c5fd" font-size="11"># sendSuccess(res, data, status, msg)</text>
  <text x="290" y="118" fill="#93c5fd" font-size="11"># sendError(res, message, status)</text>

  <path d="M 140 190 L 140 110 L 275 110" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow2)"/>
  <path d="M 425 190 L 425 140" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow2)"/>
  <path d="M 710 190 L 710 110 L 575 110" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow2)"/>

  <rect x="40" y="190" width="200" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="140" y="210" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">SessionController</text>
  <text x="50" y="235" fill="#f8fafc" font-size="10">+ create(req, res)</text>
  <text x="50" y="255" fill="#f8fafc" font-size="10">+ join(req, res)</text>

  <rect x="325" y="190" width="200" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="425" y="210" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">ProductController</text>
  <text x="335" y="235" fill="#f8fafc" font-size="10">+ getByBarcode(req, res)</text>
  <text x="335" y="255" fill="#f8fafc" font-size="10">+ create(req, res)</text>

  <rect x="610" y="190" width="200" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="710" y="210" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">CheckoutController</text>
  <text x="620" y="235" fill="#f8fafc" font-size="10">+ checkout(req, res)</text>
  <text x="620" y="255" fill="#f8fafc" font-size="10">+ confirmPayment(req, res)</text>

  <path d="M 140 270 L 140 310" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 425 270 L 425 310" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 710 270 L 710 310" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="40" y="310" width="200" height="80" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="140" y="330" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">SessionService</text>
  <text x="50" y="355" fill="#cbd5e1" font-size="10">+ createSession(dto)</text>
  <text x="50" y="375" fill="#cbd5e1" font-size="10">+ joinSession(code, dto)</text>

  <rect x="325" y="310" width="200" height="80" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="425" y="330" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">ProductService</text>
  <text x="335" y="355" fill="#cbd5e1" font-size="10">+ getProductByBarcode(code)</text>
  <text x="335" y="375" fill="#cbd5e1" font-size="10">+ createProduct(data)</text>

  <rect x="610" y="310" width="200" height="80" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="710" y="330" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">CheckoutService</text>
  <text x="620" y="355" fill="#cbd5e1" font-size="10">+ processCheckout(code)</text>
  <text x="620" y="375" fill="#cbd5e1" font-size="10">+ confirmPayment(orderId)</text>
</svg>