<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240" style="background:#0f172a; border-radius:12px; font-family:system-ui, sans-serif;">
  <text x="425" y="30" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">SHOPPING SESSION STATE MACHINE</text>

  <rect x="40" y="80" width="160" height="70" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="112" fill="#60a5fa" font-size="14" font-weight="bold" text-anchor="middle">ACTIVE</text>
  <text x="120" y="132" fill="#94a3b8" font-size="11" text-anchor="middle">Customer Scanning</text>

  <path d="M 200 115 L 295 115" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="247" y="105" fill="#f8fafc" font-size="10" text-anchor="middle">Checkout</text>

  <rect x="300" y="80" width="180" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="390" y="112" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">CHECKOUT_PENDING</text>
  <text x="390" y="132" fill="#94a3b8" font-size="11" text-anchor="middle">Cart Locked / Awaiting Pay</text>

  <path d="M 480 115 L 575 115" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="527" y="105" fill="#34d399" font-size="10" text-anchor="middle">Confirm Pay</text>

  <rect x="580" y="80" width="160" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="660" y="112" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">COMPLETED</text>
  <text x="660" y="132" fill="#94a3b8" font-size="11" text-anchor="middle">Stock Decremented</text>

  <path d="M 390 150 L 390 195 L 120 195 L 120 150" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="255" y="185" fill="#fca5a5" font-size="10" text-anchor="middle">Payment Cancelled / Retry</text>
</svg>