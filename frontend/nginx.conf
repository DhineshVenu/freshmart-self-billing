server {
    listen 80;
    server_name localhost;

    # Gzip compression for static web bundles
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Web Assets (React 19 SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Essential SPA Fallback Routing: Redirects route requests to index.html
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy backend Express API requests
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support real-time Server-Sent Events (SSE) streaming
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Custom 404 / 50x error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
