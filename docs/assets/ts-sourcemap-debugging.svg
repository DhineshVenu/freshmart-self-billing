<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250" style="background:#0f172a; border-radius:12px; font-family:system-ui, sans-serif;">
  <text x="425" y="30" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">HOW SOURCE MAPS (.js.map) ENABLE TYPESCRIPT DEBUGGING</text>

  <rect x="30" y="60" width="220" height="160" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="85" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">TypeScript Source (.ts)</text>
  <text x="45" y="110" fill="#f8fafc" font-size="10">backend/src/server.ts</text>
  <rect x="45" y="125" width="190" height="30" rx="4" fill="#0f172a" stroke="#ef4444"/>
  <text x="55" y="145" fill="#f87171" font-size="10">&#9679; Breakpoint Line 45</text>
  <text x="45" y="180" fill="#94a3b8" font-size="9">Developer inspects variables</text>
  <text x="45" y="195" fill="#94a3b8" font-size="9">in original readable TypeScript!</text>

  <path d="M 250 135 L 315 135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="315" y="60" width="220" height="160" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="425" y="85" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">Source Map (.js.map)</text>
  <text x="330" y="110" fill="#f8fafc" font-size="10">backend/dist/server.js.map</text>
  <rect x="330" y="125" width="190" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="340" y="145" fill="#cbd5e1" font-size="9">"sources": ["../src/server.ts"]</text>
  <text x="340" y="162" fill="#34d399" font-size="9">"mappings": "AAAA,IAAMA..."</text>
  <text x="330" y="195" fill="#94a3b8" font-size="9">VLQ-encoded bidirectional map</text>

  <path d="M 535 135 L 600 135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="60" width="220" height="160" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="710" y="85" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">Runtime Engine (V8)</text>
  <text x="615" y="110" fill="#f8fafc" font-size="10">Node.js executes server.js</text>
  <rect x="615" y="125" width="190" height="30" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="625" y="145" fill="#f8fafc" font-size="10">Line 92 in compiled JS</text>
  <text x="615" y="180" fill="#94a3b8" font-size="9">Engine executes transpiled JS,</text>
  <text x="615" y="195" fill="#94a3b8" font-size="9">debugger syncs back via map!</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>
</svg>