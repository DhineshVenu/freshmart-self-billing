<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320" style="background:#0f172a; border-radius:12px; font-family:system-ui, -apple-system, sans-serif;">
  <text x="460" y="32" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">WEBPACK 5 CLIENT COMPILATION &amp; BUNDLING PIPELINE</text>

  <!-- Step 1: Input Sources -->
  <rect x="25" y="65" width="150" height="225" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="100" y="92" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">ENTRY &amp; SOURCES</text>
  <rect x="37" y="110" width="126" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="100" y="130" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">./src/main.tsx</text>
  <rect x="37" y="152" width="126" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="100" y="170" fill="#f8fafc" font-size="10" text-anchor="middle">React TSX Pages</text>
  <rect x="37" y="188" width="126" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="100" y="206" fill="#f8fafc" font-size="10" text-anchor="middle">App.css / index.css</text>
  <rect x="37" y="224" width="126" height="28" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="100" y="242" fill="#f8fafc" font-size="10" text-anchor="middle">Icons &amp; Audio Chime</text>
  <text x="100" y="275" fill="#64748b" font-size="9" text-anchor="middle">283 Modules Total</text>

  <!-- Arrow 1 -->
  <path d="M 185 177 L 215 177" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 2: Loaders -->
  <rect x="225" y="65" width="195" height="225" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="322" y="92" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">MODULE LOADERS</text>
  <rect x="237" y="110" width="171" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="322" y="128" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">babel-loader</text>
  <text x="322" y="145" fill="#94a3b8" font-size="9.5" text-anchor="middle">TSX / JSX → Vanilla JS</text>
  <rect x="237" y="166" width="171" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="322" y="184" fill="#a78bfa" font-size="11" font-weight="bold" text-anchor="middle">css-loader</text>
  <text x="322" y="201" fill="#94a3b8" font-size="9.5" text-anchor="middle">Parses @import &amp; url()</text>
  <rect x="237" y="222" width="171" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="322" y="240" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">Asset Modules</text>
  <text x="322" y="257" fill="#94a3b8" font-size="9.5" text-anchor="middle">8KB Inline / Resource</text>

  <!-- Arrow 2 -->
  <path d="M 430 177 L 460 177" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <!-- Step 3: Plugins -->
  <rect x="470" y="65" width="205" height="225" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="572" y="92" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">PLUGINS &amp; LIFECYCLE</text>
  <rect x="482" y="110" width="181" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="572" y="128" fill="#f472b6" font-size="11" font-weight="bold" text-anchor="middle">HtmlWebpackPlugin</text>
  <text x="572" y="145" fill="#94a3b8" font-size="9.5" text-anchor="middle">Injects &lt;script&gt; into HTML</text>
  <rect x="482" y="166" width="181" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="572" y="184" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">DefinePlugin</text>
  <text x="572" y="201" fill="#94a3b8" font-size="9.5" text-anchor="middle">Inlines NODE_ENV constant</text>
  <rect x="482" y="222" width="181" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="572" y="240" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">MiniCssExtractPlugin</text>
  <text x="572" y="257" fill="#94a3b8" font-size="9.5" text-anchor="middle">Extracts dedicated .css</text>

  <!-- Arrow 3 -->
  <path d="M 685 177 L 715 177" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <!-- Step 4: SplitChunks & Output -->
  <rect x="725" y="65" width="170" height="225" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="810" y="92" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">OUTPUT BUNDLES</text>
  <rect x="737" y="110" width="146" height="34" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="810" y="125" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">main.[hash].js</text>
  <text x="810" y="138" fill="#94a3b8" font-size="8.5" text-anchor="middle">App UI (~68 KB)</text>
  <rect x="737" y="150" width="146" height="34" rx="6" fill="#0f172a" stroke="#a78bfa"/>
  <text x="810" y="165" fill="#c084fc" font-size="10" font-weight="bold" text-anchor="middle">vendors.[hash].js</text>
  <text x="810" y="178" fill="#94a3b8" font-size="8.5" text-anchor="middle">SplitChunks (~701 KB)</text>
  <rect x="737" y="190" width="146" height="34" rx="6" fill="#0f172a" stroke="#34d399"/>
  <text x="810" y="205" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">main.[hash].css</text>
  <text x="810" y="218" fill="#94a3b8" font-size="8.5" text-anchor="middle">Extracted CSS (~42 KB)</text>
  <rect x="737" y="230" width="146" height="34" rx="6" fill="#0f172a" stroke="#f472b6"/>
  <text x="810" y="245" fill="#f472b6" font-size="10" font-weight="bold" text-anchor="middle">index.html</text>
  <text x="810" y="258" fill="#94a3b8" font-size="8.5" text-anchor="middle">HTML Entry (427 B)</text>
  <text x="810" y="280" fill="#64748b" font-size="9" text-anchor="middle">dist-webpack/</text>
</svg>