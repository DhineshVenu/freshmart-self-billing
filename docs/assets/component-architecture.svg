<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="480" style="background:#0f172a; border-radius:12px; font-family:system-ui, sans-serif;">
  <text x="425" y="30" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">SYSTEM COMPONENT ARCHITECTURE (MODULAR MONOLITH)</text>
  
  <rect x="30" y="50" width="790" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="45" y="72" fill="#60a5fa" font-size="12" font-weight="bold">CLIENT PRESENTATION LAYER (React 19 + TypeScript)</text>
  
  <rect x="45" y="85" width="140" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="115" y="109" fill="#f8fafc" font-size="11" text-anchor="middle">Worker POS</text>
  
  <rect x="195" y="85" width="140" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="265" y="109" fill="#f8fafc" font-size="11" text-anchor="middle">Customer Check-In</text>
  
  <rect x="345" y="85" width="160" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="425" y="109" fill="#f8fafc" font-size="11" text-anchor="middle">Cart &amp; Camera Scanner</text>
  
  <rect x="515" y="85" width="140" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="585" y="109" fill="#f8fafc" font-size="11" text-anchor="middle">Customer History</text>
  
  <rect x="665" y="85" width="140" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="735" y="109" fill="#f8fafc" font-size="11" text-anchor="middle">Admin Dashboard</text>

  <path d="M 425 140 L 425 165" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="30" y="170" width="790" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="45" y="192" fill="#34d399" font-size="12" font-weight="bold">API GATEWAY &amp; ROUTING LAYER (Express 5)</text>
  <rect x="45" y="205" width="230" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="160" y="225" fill="#f8fafc" font-size="11" text-anchor="middle">JWT Cookie Auth Middleware</text>
  <rect x="290" y="205" width="230" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="405" y="225" fill="#f8fafc" font-size="11" text-anchor="middle">Role-Based Access Control (RBAC)</text>
  <rect x="535" y="205" width="270" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="670" y="225" fill="#f8fafc" font-size="11" text-anchor="middle">Versioned Routers (/api/v1/*)</text>

  <path d="M 425 250 L 425 275" stroke="#34d399" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="30" y="280" width="790" height="80" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="45" y="302" fill="#c084fc" font-size="12" font-weight="bold">DOMAIN SERVICE LAYER (OOP Architecture)</text>
  <rect x="45" y="315" width="115" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="102" y="335" fill="#f8fafc" font-size="10" text-anchor="middle">AuthService</text>
  <rect x="170" y="315" width="115" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="227" y="335" fill="#f8fafc" font-size="10" text-anchor="middle">SessionService</text>
  <rect x="295" y="315" width="115" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="352" y="335" fill="#f8fafc" font-size="10" text-anchor="middle">ProductService</text>
  <rect x="420" y="315" width="115" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="477" y="335" fill="#f8fafc" font-size="10" text-anchor="middle">CartService</text>
  <rect x="545" y="315" width="125" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="607" y="335" fill="#f8fafc" font-size="10" text-anchor="middle">CheckoutService</text>
  <rect x="680" y="315" width="125" height="32" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="742" y="335" fill="#f8fafc" font-size="10" text-anchor="middle">WorkerService</text>

  <path d="M 425 360 L 425 385" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="30" y="390" width="790" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="45" y="412" fill="#fbbf24" font-size="12" font-weight="bold">PERSISTENCE LAYER (MongoDB + Mongoose Models)</text>
  <rect x="45" y="420" width="110" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="439" fill="#94a3b8" font-size="10" text-anchor="middle">User Model</text>
  <rect x="165" y="420" width="120" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="225" y="439" fill="#94a3b8" font-size="10" text-anchor="middle">Product Model</text>
  <rect x="295" y="420" width="130" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="360" y="439" fill="#94a3b8" font-size="10" text-anchor="middle">Session Model</text>
  <rect x="435" y="420" width="110" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="490" y="439" fill="#94a3b8" font-size="10" text-anchor="middle">Cart Model</text>
  <rect x="555" y="420" width="120" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="615" y="439" fill="#94a3b8" font-size="10" text-anchor="middle">Order Model</text>
  <rect x="685" y="420" width="120" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="745" y="439" fill="#94a3b8" font-size="10" text-anchor="middle">AuditLog Model</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>
</svg>