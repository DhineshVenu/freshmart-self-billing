<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250" style="background:#0f172a; border-radius:12px; font-family:system-ui, sans-serif;">
  <text x="425" y="30" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">MODULES (FILE-BASED) VS NAMESPACES (OBJECT-BASED)</text>

  <rect x="30" y="55" width="375" height="175" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="217" y="80" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">ES Modules (Modern Standard)</text>
  <rect x="45" y="95" width="345" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="55" y="115" fill="#f8fafc" font-size="11">Scope: File-level isolation (one file = one module)</text>
  <rect x="45" y="132" width="345" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="55" y="152" fill="#f8fafc" font-size="11">Syntax: import { CartService } from "./services"</text>
  <rect x="45" y="170" width="345" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="55" y="188" fill="#34d399" font-size="11">&#10004; Tree-shakable by Vite &amp; Webpack bundlers</text>
  <text x="55" y="204" fill="#94a3b8" font-size="10">Used across all controllers, services &amp; UI components</text>

  <rect x="445" y="55" width="375" height="175" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="632" y="80" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">TypeScript Namespaces</text>
  <rect x="460" y="95" width="345" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="470" y="115" fill="#f8fafc" font-size="11">Scope: Named JavaScript object closure (IIFE)</text>
  <rect x="460" y="132" width="345" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="470" y="152" fill="#f8fafc" font-size="11">Syntax: namespace SupermarketDomain { ... }</text>
  <rect x="460" y="170" width="345" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="470" y="188" fill="#38bdf8" font-size="11">&#10004; Perfect for internal math &amp; validation engines</text>
  <text x="470" y="204" fill="#94a3b8" font-size="10">Can span multiple files or group types within a single file</text>
</svg>